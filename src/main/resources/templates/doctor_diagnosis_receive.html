<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Tiếp nhận khám - MedCare</title>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>

        html, body{
            height:100%;
        }

        body{
            background:#f9fafc;
            font-family:'Segoe UI',sans-serif;

            display:flex;
            flex-direction:column;
        }

        .main-content{
            flex:1;
        }

        .card-box{
            background:#fff;
            border-radius:12px;
            padding:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.05);
            margin-bottom:20px;
        }

        .btn-save{
            background:#0c56d0;
            color:white;
            border-radius:25px;
            font-weight:600;
        }

        .text-error{
            color:red;
            font-size:14px;
            margin-top:5px;
            display:block;
        }

    </style>

</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <div class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3 class="text-primary">
                🩺 Tiếp nhận khám
            </h3>

            <a th:href="@{/doctor/patients}"
               class="btn btn-secondary">

                ← Quay lại

            </a>

        </div>

        <!-- ERROR -->
        <div th:if="${error}"
             class="alert alert-danger text-center">

            <span th:text="${error}"></span>

        </div>

        <!-- INFO -->
        <div class="card-box">

            <h5 th:text="${appointment.patient.username}">
                Patient
            </h5>

            <p>

                <strong>Thời gian:</strong>

                <span th:text="${#temporals.format(
                        appointment.appointmentTime,
                        'HH:mm dd/MM/yyyy'
                )}">
                </span>

            </p>

            <p>

                <strong>Ghi chú:</strong>

                <span th:text="${appointment.note}">
                </span>

            </p>

        </div>

        <!-- FORM -->
        <form th:action="@{/doctor/diagnosis/save}"
              method="post">

            <input type="hidden"
                   name="appointmentId"
                   th:value="${appointment.id}">

            <div class="card-box">

                <!-- TRIỆU CHỨNG -->
                <div class="form-group">

                    <label>Triệu chứng</label>

                    <textarea class="form-control"
                              name="symptoms"
                              rows="3"
                              th:text="${symptoms}">
                    </textarea>

                    <small class="text-error"
                           th:if="${symptomsError}"
                           th:text="${symptomsError}">
                    </small>

                </div>

                <!-- CHẨN ĐOÁN -->
                <div class="form-group">

                    <label>Chẩn đoán</label>

                    <textarea class="form-control"
                              name="diagnosis"
                              rows="3"
                              th:text="${diagnosis}">
                    </textarea>

                    <small class="text-error"
                           th:if="${diagnosisError}"
                           th:text="${diagnosisError}">
                    </small>

                </div>

                <!-- KẾT QUẢ -->
                <div class="form-group">

                    <label>Kết quả</label>

                    <textarea class="form-control"
                              name="result"
                              rows="3"
                              th:text="${resultValue}">
                    </textarea>

                </div>

            </div>

            <!-- MEDICINE -->
            <div class="card-box">

                <h5>
                    💊 Thuốc kê đơn
                </h5>

                <small class="text-error mb-3"
                       th:if="${medicineError}"
                       th:text="${medicineError}">
                </small>

                <div th:each="medicine, stat : ${medicines}"
                     class="border p-3 mb-3 rounded">

                    <input type="hidden"
                           name="medicineIds"
                           th:value="${medicine.id}">

                    <div class="row">

                        <!-- NAME -->
                        <div class="col-md-4">

                            <label>Tên thuốc</label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${medicine.name}"
                                   readonly>

                        </div>

                        <!-- QTY -->
                        <div class="col-md-3">

                            <label>Số lượng</label>

                            <input type="number"
                                   class="form-control"
                                   name="quantities"
                                   min="0"
                                   value="0">

                        </div>

                        <!-- DOSAGE -->
                        <div class="col-md-5">

                            <label>Liều dùng</label>

                            <input type="text"
                                   class="form-control"
                                   name="dosages"
                                   placeholder="VD: ngày 2 lần">

                        </div>

                    </div>

                </div>

            </div>

            <button type="submit"
                    class="btn btn-save">

                💾 Lưu hồ sơ khám

            </button>

        </form>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
