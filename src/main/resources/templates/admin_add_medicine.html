<!doctype html>
<html lang="vi">
<head>
    <title th:text="${medicine.id == null ? 'Thêm thuốc mới' : 'Sửa thuốc'}"></title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
          crossorigin="anonymous">
    <style>
        .text-danger{
            color: red;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h3 class="mb-4" th:classappend="${medicine.id == null ? 'text-primary' : 'text-warning'}">
        <i th:classappend="${medicine.id == null ? 'fas fa-plus' : 'fas fa-edit'}"></i>
        <span th:text="${medicine.id == null ? 'Thêm thuốc mới' : 'Sửa thuốc'}"></span>
    </h3>

    <form th:action="@{${formAction}}" th:object="${medicine}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Tên thuốc</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label>Số lượng</label>
            <input type="number" th:field="*{stock}" class="form-control" >
            <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
        </div>

        <div class="form-group">
            <label>Đơn vị</label>
            <input type="text" th:field="*{unit}" class="form-control" >
            <div class="text-danger" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></div>
        </div>

        <div class="form-group">
            <label>Giá</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" >
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="form-group">
            <label>Mô tả</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn"
                th:classappend="${medicine.id == null ? 'btn-primary' : 'btn-warning'}"
                th:text="${medicine.id == null ? 'Lưu' : 'Cập nhật'}"></button>
        <a th:href="@{/admin/medicines}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
