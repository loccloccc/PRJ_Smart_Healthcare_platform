<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Danh sách bệnh nhân - MedCare</title>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>

        html, body{
            height:100%;
            margin:0;
        }

        body{
            background-color:#f9fafc;
            font-family:'Segoe UI',sans-serif;

            display:flex;
            flex-direction:column;
        }

        main{
            flex:1;
        }

        .table-box{
            background:#fff;
            padding:20px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-accept{
            background:#0c56d0;
            color:white;
            border-radius:25px;
            font-weight:600;
        }

    </style>

</head>

<body>

<div th:replace="fragments/header :: header"></div>

<main>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="text-primary">
                Danh sách bệnh nhân chờ khám
            </h3>

            <a th:href="@{/doctor/home}"
               class="btn btn-secondary">

                ← Quay lại

            </a>

        </div>

        <div class="table-box">

            <table class="table table-hover">

                <thead class="thead-light">

                <tr>

                    <th>Bệnh nhân</th>
                    <th>Thời gian</th>
                    <th>Lý do khám</th>
                    <th>Trạng thái</th>
                    <th></th>

                </tr>

                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(appointments)}">

                    <td colspan="5"
                        class="text-center text-muted">

                        Chưa có bệnh nhân.

                    </td>

                </tr>

                <tr th:each="appt : ${appointments}">

                    <td th:text="${appt.patient.username}"></td>

                    <td>

                        <span th:text="${#temporals.format(
                        appt.appointmentTime,
                        'HH:mm dd/MM/yyyy'
                    )}">
                        </span>

                    </td>

                    <td th:text="${appt.note != null ? appt.note : 'Không có ghi chú'}">
                    </td>

                    <td>

                        <span class="badge badge-warning"
                              th:text="${appt.status}">
                        </span>

                    </td>

                    <td>

                        <a th:href="@{/doctor/diagnosis/{id}(id=${appt.id})}"
                           class="btn btn-accept btn-sm">

                            Tiếp nhận

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
