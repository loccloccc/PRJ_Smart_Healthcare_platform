<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý bệnh nhân</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background: #f4f6f9;
            font-family: Arial;
        }

        .container-box {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .title {
            color: #0c56d0;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-action {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .btn-lock {
            background: darkred;
            color: white;
        }

        .btn-view {
            background: #17a2b8;
            color: white;
        }
    </style>
</head>

<body>
<div th:replace="fragments/header :: header"></div>
<div class="container container-box">
    <h3 class="title">🧑‍🤝‍🧑 Quản lý bệnh nhân</h3>
    <!-- THÊM NÚT -->
    <div class="container mt-3 mb-3">
        <a th:href="@{/admin/home}" class="btn btn-primary">
            ← Quay lại trang chủ
        </a>

    </div>
    <table class="table table-bordered table-hover">

        <thead>
        <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>SĐT</th>
            <th>Giới tính</th>
            <th>Địa chỉ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u , start : ${userProfiles}">
            <td th:text="${start.count}">1</td>
            <td th:text="${u.fullName}">Nguyễn Văn C</td>
            <td th:text="${u.phone}">0901111111</td>
            <td th:text="${u.gender}">Nam</td>
            <td th:text="${u.address}">Hà Nội</td>
        </tr>
        </tbody>

    </table>

</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
