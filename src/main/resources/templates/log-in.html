<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập MedCare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            display: flex;
            width: 100%;
            max-width: 950px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .left-panel {
            background-color: #0c56d0;
            color: #fff;
            padding: 40px;
            flex: 1;
        }
        .right-panel {
            flex: 1;
            padding: 40px;
        }
        .btn-custom {
            border-radius: 25px;
            font-weight: 600;
            background-color: #0c56d0;
            color: #fff;
            border: none;
        }
        .btn-custom:hover {
            background-color: #0945a8;
        }
    </style>
</head>

<body>
<div class="login-box">

    <!-- LEFT -->
    <div class="left-panel">
        <h3>MedCare Digital</h3>
        <p class="mt-3">Nền tảng chăm sóc sức khỏe số, an toàn và tiện lợi.</p>
        <ul class="mt-4">
            <li>🔒 Bảo mật dữ liệu y tế</li>
            <li>⚡ Kết nối nhanh với bác sĩ</li>
            <li>📚 Quản lý hồ sơ sức khỏe</li>
        </ul>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">

        <h4 class="text-center mb-4 text-primary">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </h4>


        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:if="${error == 'notfound'}">Tài khoản không tồn tại</span>
            <span th:if="${error == 'wrong'}">Sai mật khẩu</span>
        </div>

        <!-- ✅ FORM (CHỈ 1 FORM DUY NHẤT) -->
        <form th:action="@{/handleLogin}" method="post">

            <div class="form-group">
                <label>Email</label>
                <input type="text" name="email"
                       class="form-control"
                       placeholder="example@gmail.com"
                       required>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-custom w-100 mb-3">
                Đăng nhập
            </button>

            <div class="text-center">
                <span>Chưa có tài khoản?</span>
                <a th:href="@{/register}" class="text-primary font-weight-bold">
                    Đăng ký
                </a>
            </div>

        </form>
    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
