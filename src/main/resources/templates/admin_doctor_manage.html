<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Quản lý bác sĩ - Admin</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .title {
            color: #0c56d0;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }

        .btn-edit {
            background: orange;
            color: white;
            border-radius: 20px;
        }

        .btn-del {
            background: red;
            color: white;
            border-radius: 20px;
        }
    </style>
</head>

<body>
<div th:replace="fragments/header :: header"></div>
<h2 class="title">QUẢN LÝ BÁC SĨ</h2>
<!-- THÊM NÚT -->
<div class="container mt-3">

    <a th:href="@{/admin/home}" class="btn btn-primary">
        ← Quay lại trang chủ
    </a>

</div>
<div class="container box">

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Họ tên</th>
            <th>SĐT</th>
            <th>Chuyên khoa</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="u , start : ${userProfiles}">
            <td th:text="${start.count}">1</td>
            <td th:text="${u.user.username}">Nguyễn Văn C</td>
            <td th:text="${u.phone}">0901111111</td>
            <td th:text="${u.phone}">Nam</td>
            <td th:text="${u.add}">Hà Nội</td>
        </tr>
        </tbody>

    </table>

</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
